.ruhe{animation-name:ruhe}@keyframes ruhe{0%,12.5%{opacity:1}15.625%,86.25%{opacity:0}89.375%,100%{opacity:1}}
.neutral{animation-name:neutral}@keyframes neutral{0%,42.5%{opacity:1}45.625%,86.25%{opacity:0}89.375%,100%{opacity:1}}
