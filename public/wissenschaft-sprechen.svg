<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 8 420 300" width="420" height="300" role="img" aria-label="Vokabelkarte Gelegenheit; das Mikrofon hört zu, erkennt opportunity und die Karte wird grün"><title>VocabTrack – Sprechabfrage</title><style>.an{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.sw{animation:sw 5.2s ease-in-out infinite}@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.eq{transform-box:fill-box;transform-origin:center;animation:eq .5s ease-in-out infinite alternate}@keyframes eq{0%{transform:scaleY(.35)}100%{transform:scaleY(1)}}
.hop{animation-name:hop}@keyframes hop{0%,42.5%{transform:translateY(0)}45.625%{transform:translateY(-14px)}48.75%,100%{transform:translateY(0)}}
