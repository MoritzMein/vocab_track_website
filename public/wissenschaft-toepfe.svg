<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 310" width="540" height="310" role="img" aria-label="Drei Töpfe richtig, fast richtig und falsch; mit jedem Durchgang wandern Vokabeln nach richtig, bis nichts mehr übrig ist und Beenden abgehakt wird"><title>VocabTrack – Lernen bis zum Kriterium</title><style>.an{animation-duration:9s;animation-iteration-count:infinite;animation-timing-function:ease-out}
.sw{animation:sw 5.4s ease-in-out infinite}@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.ph0{animation-name:ph0}@keyframes ph0{0%,31.111%{opacity:1;transform:translateY(0)}33.333%,97.778%{opacity:0;transform:translateY(-8px)}100%{opacity:1;transform:translateY(0)}}
.ph1{animation-name:ph1}@keyframes ph1{0%,33.222%{opacity:0;transform:translateY(8px)}35.556%,62.222%{opacity:1;transform:translateY(0)}64.444%,100%{opacity:0;transform:translateY(-8px)}}
