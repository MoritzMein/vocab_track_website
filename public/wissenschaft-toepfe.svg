.ok{transform-box:fill-box;transform-origin:center;animation-name:ok}@keyframes ok{0%,64.444%{transform:scale(0)}67.222%{transform:scale(1.3)}70%,95.556%{transform:scale(1)}98.333%,100%{transform:scale(0)}}
