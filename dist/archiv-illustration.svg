<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 480" width="560" height="480" role="img" aria-label="Goldene Archivkarte, umgeben von Archivstempel, goldener Uhr und Punkteleiste">
<title>VocabTrack – Gelernt bleibt gelernt</title>
<style>
  .va-an{transform-box:fill-box;transform-origin:center}
  .va-puls{animation:va-puls 2.2s ease-in-out infinite}
  .va-zeiger{animation:va-zurueck 6s ease-in-out infinite}
  @keyframes va-schweben{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
  @keyframes va-schaukeln{0%,100%{transform:rotate(-5deg) translateY(0)}50%{transform:rotate(5deg) translateY(-7px)}}
  @keyframes va-funkeln{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
  @keyframes va-puls{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
  @keyframes va-zurueck{0%,55%{transform:scale(2.6) rotate(0)}80%,100%{transform:scale(2.6) rotate(-360deg)}}
  @media (prefers-reduced-motion:reduce){.va-an{animation:none!important}}
</style>
