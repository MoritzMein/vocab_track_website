<svg xmlns="http://www.w3.org/2000/svg" viewBox="90 8 420 314" width="420" height="314" role="img" aria-label="Vokabelkarte Gelegenheit dreht sich zu opportunity, während der Umschalter Deutsch und Englisch tauscht"><title>VocabTrack – Abfrage in beide Richtungen</title><style>.an{animation-duration:8s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.za{animation-name:za}@keyframes za{0%,45%{opacity:1;transform:translateY(0)}48.75%{opacity:0;transform:translateY(9px)}48.76%,97.5%{opacity:0;transform:translateY(-9px)}100%{opacity:1;transform:translateY(0)}}
.zb{animation-name:zb}@keyframes zb{0%,48.75%{opacity:0;transform:translateY(-9px)}52.5%,95%{opacity:1;transform:translateY(0)}97.5%,100%{opacity:0;transform:translateY(9px)}}
.pf{animation-name:pf}@keyframes pf{0%,45%{transform:rotate(0)}52.5%,95%{transform:rotate(180deg)}100%{transform:rotate(360deg)}}
.fl{animation-name:fl}@keyframes fl{0%,45%{transform:scale(1)}48.75%{transform:scale(.96)}52.5%,95%{transform:scale(1)}97.5%{transform:scale(.96)}100%{transform:scale(1)}}
.de{animation-name:de;animation-timing-function:linear}@keyframes de{0%,48.75%{opacity:1}48.76%,97.5%{opacity:0}97.51%,100%{opacity:1}}
.en{animation-name:en;animation-timing-function:linear}@keyframes en{0%,48.75%{opacity:0}48.76%,97.5%{opacity:1}97.51%,100%{opacity:0}}
.sw{animation:sw 5.2s ease-in-out infinite}@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
